<style>
  main { padding: 32px var(--gutter) 80px; max-width: 1800px; margin: 0 auto; }
  .head { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; border-bottom: 1px solid var(--ln); padding-bottom: 20px; }
  .head h1 { font-size: clamp(40px, 7vw, 88px); line-height: .9; }
  .head p { color: var(--mu); max-width: 62ch; }
  .filters { display: grid; gap: 8px; margin: 20px 0 28px; }
  .filters div { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { font: 500 12px/1 var(--mono); text-transform: uppercase; border: 1px solid var(--ln-2); padding: 10px 14px; min-height: 40px; }
  .count { font: 12px var(--mono); color: var(--mu); }
  .grid { columns: 4 300px; column-gap: 20px; }
  .t { break-inside: avoid; margin: 0 0 20px; background: var(--panel); border: 1px solid var(--ln); }
  .t[hidden] { display: none; }
  .shot { display: block; width: 100%; cursor: zoom-in; }
  .shot img { width: 100%; height: auto; }
  figcaption { padding: 12px 14px 16px; display: grid; gap: 5px; }
  figcaption h2 { font-size: 22px; line-height: 1.05; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tags span { font: 500 10.5px/1 var(--mono); text-transform: uppercase; color: var(--ac); border: 1px solid var(--ln-2); padding: 4px 6px; }
  .tags .o { color: var(--tx); }
  .tags .a { color: var(--mu); }
  .mood { color: var(--ac); font: 500 12px var(--mono); text-transform: uppercase; }
  .m { color: var(--mu); font-size: 14px; }
  .m b { color: var(--tx); font-weight: 600; }
  dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgba(0, 0, 0, .85); }
  dialog img { max-width: 96vw; max-height: 92vh; width: auto; height: auto; display: block; margin: 0 auto; }
  dialog button { display: block; margin: 8px auto 0; font: 600 12px var(--mono); text-transform: uppercase; background: var(--ac); color: var(--on-ac); padding: 10px 16px; }
</style>
</head>

<dialog id="view"><img alt=""><button type="button">Close</button></dialog>
<script>
  const state = { niche: 'all', tier: 'all', tone: 'all', source: 'all' };
  const cards = [...document.querySelectorAll('.t')];
  const count = document.getElementById('count');
  function apply() {
    let n = 0;
    cards.forEach((t) => {
      const d = t.dataset;
      const show = (state.niche === 'all' || d.niche === state.niche) && (state.tier === 'all' || d.tier === state.tier)
        && (state.tone === 'all' || d.tone === state.tone) && (state.source === 'all' || (state.source === 'old') === (d.old === 'true'));
      t.hidden = !show; if (show) n++;
    });
    count.textContent = n + ' shown.';
  }
  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
    const group = Object.keys(b.dataset)[0];
    state[group] = b.dataset[group];
    document.querySelectorAll('[data-' + group + ']').forEach((x) => { if (x.tagName === 'BUTTON') x.setAttribute('aria-pressed', x === b); });
    apply();
  }));
  const dlg = document.getElementById('view');
  document.querySelectorAll('.shot').forEach((b) => b.addEventListener('click', () => { dlg.querySelector('img').src = b.dataset.src; dlg.showModal(); }));
  dlg.addEventListener('click', () => dlg.close());
  apply();
  const selected = new URLSearchParams(location.search).get('template');
  if (selected) {
    const card = cards.find((item) => item.dataset.num === selected);
    if (card) { card.scrollIntoView({ block: 'center' }); card.querySelector('.shot').click(); }
  }
</script>
